<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400">
  <defs>
    <!-- Background -->
    <radialGradient id="bg" cx="35%" cy="50%" r="70%"
                    gradientUnits="userSpaceOnUse" fx="450" fy="200">
      <stop offset="0%" stop-color="#1E1048"/>
      <stop offset="100%" stop-color="#06080F"/>
    </radialGradient>

    <!-- Origin cards — 3 violet shades -->
    <linearGradient id="gV1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5B21B6"/>
      <stop offset="100%" stop-color="#3B0764"/>
    </linearGradient>
    <linearGradient id="gV2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#4C1D95"/>
    </linearGradient>
    <linearGradient id="gV3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>

    <!-- Destination — cyan -->
    <linearGradient id="gC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Destination glow -->
    <filter id="fCardGlow" x="-24%" y="-18%" width="148%" height="136%">
      <feDropShadow dx="0" dy="0" stdDeviation="18"
                    flood-color="#38BDF8" flood-opacity="0.50"/>
    </filter>

    <!-- Note glow -->
    <filter id="fNoteGlow" x="-90%" y="-80%" width="280%" height="260%">
      <feDropShadow dx="0" dy="2" stdDeviation="20"
                    flood-color="#F59E0B" flood-opacity="0.80"/>
    </filter>

    <!-- Subtle divider line -->
    <linearGradient id="gDivider" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#7C3AED" stop-opacity="0"/>
      <stop offset="40%"  stop-color="#7C3AED" stop-opacity="0.35"/>
      <stop offset="60%"  stop-color="#06B6D4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="400" fill="url(#bg)"/>

  <!-- ════════════════════════════════════════════
       ORIGIN GROUP  — 3 cards (contexts)
       Cards: 148×256, stacked diagonally
       ════════════════════════════════════════════ -->

  <!-- Card 1 — Personal (back) -->
  <rect x="56" y="72" width="148" height="256" rx="16"
        fill="url(#gV1)" opacity="0.36"/>

  <!-- Card 2 — Universidad (mid) -->
  <rect x="96" y="82" width="148" height="256" rx="16"
        fill="url(#gV2)" opacity="0.58"/>
  <!-- Lines -->
  <rect x="116" y="144" width="98" height="8" rx="4" fill="white" opacity="0.16"/>
  <rect x="116" y="160" width="70" height="8" rx="4" fill="white" opacity="0.12"/>

  <!-- Card 3 — Bloque (front, current) -->
  <rect x="136" y="92" width="148" height="256" rx="16"
        fill="url(#gV3)" opacity="0.78"/>
  <!-- Lines -->
  <rect x="156" y="154" width="100" height="9" rx="4.5" fill="white" opacity="0.26"/>
  <rect x="156" y="171" width="72"  height="9" rx="4.5" fill="white" opacity="0.18"/>
  <rect x="156" y="188" width="86"  height="9" rx="4.5" fill="white" opacity="0.18"/>
  <rect x="156" y="212" width="52"  height="9" rx="4.5" fill="white" opacity="0.12"/>

  <!-- ════════════════════════════════════════════
       GAP — floating note
       Gap: 284 → 428. Center x=356, y=200
       ════════════════════════════════════════════ -->

  <g transform="rotate(8, 356, 200)" filter="url(#fNoteGlow)">
    <rect x="325" y="156" width="62" height="88" rx="8" fill="#FBBF24"/>
    <!-- Lines -->
    <rect x="337" y="176" width="38" height="6" rx="3" fill="#78350F" opacity="0.65"/>
    <rect x="337" y="190" width="26" height="6" rx="3" fill="#78350F" opacity="0.55"/>
    <rect x="337" y="204" width="32" height="6" rx="3" fill="#78350F" opacity="0.55"/>
    <rect x="337" y="218" width="20" height="6" rx="3" fill="#78350F" opacity="0.42"/>
  </g>

  <!-- ════════════════════════════════════════════
       DESTINATION CARD  — single, dominant
       x=428, y=44, 192×312
       ════════════════════════════════════════════ -->

  <g filter="url(#fCardGlow)">
    <rect x="428" y="44" width="192" height="312" rx="16" fill="url(#gC)"/>
  </g>
  <!-- Lines -->
  <rect x="452" y="114" width="128" height="10" rx="5" fill="white" opacity="0.45"/>
  <rect x="452" y="133" width="92"  height="10" rx="5" fill="white" opacity="0.32"/>
  <rect x="452" y="152" width="112" height="10" rx="5" fill="white" opacity="0.32"/>
  <rect x="452" y="179" width="72"  height="10" rx="5" fill="white" opacity="0.22"/>
  <rect x="452" y="196" width="100" height="10" rx="5" fill="white" opacity="0.22"/>

  <!-- ════════════════════════════════════════════
       DIVIDER + TEXT
       ════════════════════════════════════════════ -->

  <rect x="672" y="0" width="1" height="400" fill="url(#gDivider)"/>

  <!-- Extension name -->
  <text x="712" y="186"
        font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="58" font-weight="700" fill="white" letter-spacing="-1">
    Context Switch
  </text>

  <!-- Tagline -->
  <text x="714" y="234"
        font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="22" font-weight="400" fill="#C4B5FD" letter-spacing="0.2">
    git stash for your brain
  </text>

  <!-- Platform badge -->
  <text x="716" y="284"
        font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="15" font-weight="500" fill="#6D28D9" letter-spacing="1.5">
    RAYCAST EXTENSION
  </text>
</svg>
