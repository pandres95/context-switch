<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img">
  <title>Context Switch</title>

  <!-- Rounded-rect icon background (macOS shape) -->
  <rect width="32" height="32" rx="7" fill="#0e0c1c"/>

  <!-- Card 1 — Personal (back, violet) -->
  <rect x="2" y="4" width="14" height="9" rx="1.5"
        fill="#2d1b69" opacity="0.75"/>
  <!-- menubar hint -->
  <rect x="2" y="4" width="14" height="1.5" rx="1"
        fill="#000" fill-opacity="0.35"/>

  <!-- Card 2 — Universidad (mid, blue) -->
  <rect x="6" y="10" width="14" height="9" rx="1.5"
        fill="#0e2254" opacity="0.85"/>
  <rect x="6" y="10" width="14" height="1.5" rx="1"
        fill="#000" fill-opacity="0.35"/>

  <!-- Sticky note — landing on card-uni, top-right edge -->
  <g transform="rotate(-10, 18, 14)">
    <rect x="14.5" y="11" width="5" height="5" rx="0.8"
          fill="#fbbf24"/>
    <!-- ruled lines -->
    <line x1="15.5" y1="13"   x2="18.5" y2="13"
          stroke="#78350f" stroke-width="0.5" stroke-opacity="0.55"/>
    <line x1="15.5" y1="14.2" x2="18.5" y2="14.2"
          stroke="#78350f" stroke-width="0.5" stroke-opacity="0.42"/>
  </g>

  <!-- Card 3 — Bloque / Work (active, cyan, dominant) -->
  <rect x="16" y="17" width="14" height="10" rx="2"
        fill="#052330"/>
  <!-- cyan ambient blob inside -->
  <rect x="16" y="17" width="14" height="10" rx="2"
        fill="#0891b2" fill-opacity="0.45"/>
  <!-- menubar -->
  <rect x="16" y="17" width="14" height="1.5" rx="1"
        fill="#000" fill-opacity="0.30"/>
  <!-- active border -->
  <rect x="16" y="17" width="14" height="10" rx="2"
        fill="none" stroke="#22d3ee" stroke-width="0.7" stroke-opacity="0.8"/>
  <!-- active indicator dot -->
  <circle cx="28" cy="18.5" r="1.2" fill="#22d3ee" fill-opacity="0.9"/>
</svg>
